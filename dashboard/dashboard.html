<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Application Tracker</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-icon">💼</span>
        <span class="logo-text">Job Tracker</span>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-filter="all">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
          </svg>
          All Applications
          <span class="nav-count" id="count-all">0</span>
        </button>
        <button class="nav-item" data-filter="applied">
          <span class="dot dot-applied"></span>
          Applied
          <span class="nav-count" id="count-applied">0</span>
        </button>
        <button class="nav-item" data-filter="phone_screen">
          <span class="dot dot-phone_screen"></span>
          Phone Screen
          <span class="nav-count" id="count-phone_screen">0</span>
        </button>
        <button class="nav-item" data-filter="interview">
          <span class="dot dot-interview"></span>
          Interview
          <span class="nav-count" id="count-interview">0</span>
        </button>
        <button class="nav-item" data-filter="offer">
          <span class="dot dot-offer"></span>
          Offer
          <span class="nav-count" id="count-offer">0</span>
        </button>
        <button class="nav-item" data-filter="rejected">
          <span class="dot dot-rejected"></span>
          Rejected
          <span class="nav-count" id="count-rejected">0</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button class="btn-export" id="export-csv">Export CSV</button>
        <button class="btn-settings" id="settings-btn" title="Settings">⚙ Settings</button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <div class="toolbar">
        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
          </svg>
          <input class="search-input" id="search" type="text" placeholder="Search company or role..." />
        </div>
        <button class="btn-add" id="add-btn">+ Add Application</button>
      </div>

      <div id="stats-bar" class="stats-bar">
        <div class="stat-card">
          <span class="stat-num" id="stat-total">0</span>
          <span class="stat-lbl">Total</span>
        </div>
        <div class="stat-card">
          <span class="stat-num" id="stat-active">0</span>
          <span class="stat-lbl">Active</span>
        </div>
        <div class="stat-card success">
          <span class="stat-num" id="stat-offer">0</span>
          <span class="stat-lbl">Offers</span>
        </div>
        <div class="stat-card danger">
          <span class="stat-num" id="stat-rejected">0</span>
          <span class="stat-lbl">Rejected</span>
        </div>
      </div>

      <div id="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Company</th>
              <th>Role</th>
              <th>URL</th>
              <th>Platform</th>
              <th>Applied</th>
              <th>Status</th>
              <th>Notes</th>
              <th></th>
              <th></th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
        <div class="empty-state" id="empty-state" style="display:none">
          <svg width="64" height="64" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          <h3>No applications found</h3>
          <p>Applications you submit will appear here automatically.</p>
          <button class="btn-add-empty" id="add-empty-btn">+ Add Manually</button>
        </div>
      </div>
    </main>

  </div>

  <!-- Add / Edit Modal -->
  <div class="modal-overlay" id="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Add Application</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <form id="app-form" class="modal-form">
        <input type="hidden" id="form-id" name="id" />
        <div class="form-row">
          <label>Company <span class="req">*</span></label>
          <input type="text" id="form-company" name="company" placeholder="e.g. Stripe" required />
        </div>
        <div class="form-row">
          <label>Role <span class="req">*</span></label>
          <input type="text" id="form-role" name="role" placeholder="e.g. Senior Software Engineer" required />
        </div>
        <div class="form-row">
          <label>Job URL</label>
          <input type="url" id="form-url" name="url" placeholder="https://..." />
        </div>
        <div class="form-row two-col">
          <div>
            <label>Platform</label>
            <select id="form-platform" name="platform">
              <option value="linkedin">LinkedIn</option>
              <option value="greenhouse">Greenhouse</option>
              <option value="workday">Workday</option>
              <option value="lever">Lever</option>
              <option value="ashby">Ashby</option>
              <option value="generic">Other</option>
            </select>
          </div>
          <div>
            <label>Status</label>
            <select id="form-status" name="status">
              <option value="applied">Applied</option>
              <option value="phone_screen">Phone Screen</option>
              <option value="interview">Interview</option>
              <option value="offer">Offer</option>
              <option value="rejected">Rejected</option>
              <option value="withdrawn">Withdrawn</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <label>Notes</label>
          <textarea id="form-notes" name="notes" placeholder="Recruiter name, salary range, etc." rows="3"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn-save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Cover Letter Modal -->
  <div class="modal-overlay" id="cl-modal-overlay" style="display:none">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h2>Generate Cover Letter</h2>
        <button class="modal-close" id="cl-modal-close">&times;</button>
      </div>
      <div class="cl-job-info" id="cl-job-info"></div>
      <div class="cl-body">
        <div class="cl-col">
          <label class="cl-label">Your Resume / Background</label>
          <textarea id="cl-resume" class="cl-textarea" rows="10" placeholder="Paste your resume summary or background here…"></textarea>
          <button class="btn-generate" id="cl-generate-btn">✦ Generate Cover Letter</button>
        </div>
        <div class="cl-col">
          <div class="cl-label-row">
            <label class="cl-label">Generated Cover Letter</label>
            <button class="btn-copy" id="cl-copy-btn" style="display:none">Copy</button>
          </div>
          <div class="cl-output-wrap">
            <div class="cl-placeholder" id="cl-placeholder">Your cover letter will appear here.</div>
            <textarea id="cl-output" class="cl-textarea cl-output" rows="10" style="display:none" readonly></textarea>
            <div class="cl-loading" id="cl-loading" style="display:none">
              <div class="cl-spinner"></div>
              <span>Writing cover letter…</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
