<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      background: #0f172a;
      color: #e2e8f0;
    }

    .header {
      padding: 16px;
      background: linear-gradient(135deg, #1e40af, #4f46e5);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }

    .header p {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: #1e293b;
      border-bottom: 1px solid #1e293b;
    }

    .stat {
      background: #0f172a;
      padding: 12px 8px;
      text-align: center;
    }

    .stat-number {
      font-size: 22px;
      font-weight: 700;
      color: #60a5fa;
    }

    .stat-label {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
    }

    .recent {
      padding: 12px 16px 0;
    }

    .recent-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 8px;
    }

    .job-item {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      border-left: 3px solid #3b82f6;
    }

    .job-item[data-status="interview"] { border-left-color: #a78bfa; }
    .job-item[data-status="offer"] { border-left-color: #34d399; }
    .job-item[data-status="rejected"] { border-left-color: #f87171; }
    .job-item[data-status="phone_screen"] { border-left-color: #fbbf24; }

    .job-role {
      font-weight: 500;
      font-size: 13px;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .job-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .job-company {
      font-size: 12px;
      color: #94a3b8;
    }

    .job-date {
      font-size: 11px;
      color: #475569;
    }

    .platform-badge {
      display: inline-block;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      background: #1e3a5f;
      color: #60a5fa;
      margin-top: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 24px 16px;
      color: #475569;
    }

    .empty-state svg {
      margin-bottom: 8px;
      opacity: 0.4;
    }

    .empty-state p {
      font-size: 13px;
    }

    .actions {
      padding: 12px 16px 16px;
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 9px 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.85; }

    .btn-primary {
      background: #3b82f6;
      color: #fff;
    }

    .btn-secondary {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">💼</div>
    <div>
      <h1>Job Tracker</h1>
      <p>Your application history</p>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-number" id="total">0</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat">
      <div class="stat-number" id="active">0</div>
      <div class="stat-label">Active</div>
    </div>
    <div class="stat">
      <div class="stat-number" id="offers">0</div>
      <div class="stat-label">Offers</div>
    </div>
  </div>

  <div class="recent">
    <div class="recent-title">Recent Applications</div>
    <div id="job-list">
      <div class="empty-state">
        <svg width="40" height="40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        <p>No applications tracked yet.<br/>Apply to jobs to get started.</p>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="open-dashboard">View All Applications</button>
    <button class="btn btn-secondary" id="add-manual">+ Add</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
