<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<p>Open this file in a browser to download the extension icons.</p>
<script>
  const sizes = [16, 48, 128];

  sizes.forEach(size => {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');

    // Background
    const grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, '#1e40af');
    grad.addColorStop(1, '#4f46e5');
    ctx.fillStyle = grad;
    roundRect(ctx, 0, 0, size, size, size * 0.2);
    ctx.fill();

    // Briefcase icon
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = size * 0.06;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const pad = size * 0.18;
    const bw = size - pad * 2;
    const bh = bw * 0.65;
    const by = size * 0.42;

    // Body
    ctx.beginPath();
    roundRect(ctx, pad, by, bw, bh, size * 0.06);
    ctx.fill();

    // Handle
    const hw = bw * 0.4;
    const hx = (size - hw) / 2;
    ctx.fillStyle = '#4f46e5';
    ctx.beginPath();
    roundRect(ctx, hx, by - bh * 0.3, hw, bh * 0.32, size * 0.04);
    ctx.fill();

    // Middle line
    ctx.strokeStyle = '#4f46e5';
    ctx.lineWidth = size * 0.05;
    ctx.beginPath();
    ctx.moveTo(pad, by + bh * 0.45);
    ctx.lineTo(pad + bw, by + bh * 0.45);
    ctx.stroke();

    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `icon-${size}.png`;
      a.textContent = `Download ${size}x${size}`;
      a.style.display = 'block';
      a.style.margin = '8px';
      a.click();
      document.body.appendChild(a);
      URL.revokeObjectURL(url);
    });
  });

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }
</script>
</body>
</html>
